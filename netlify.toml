[build]
  command = "mkdir -p components utils types hooks assets/images public && mv -f AdminDashboard.tsx BrandLogo.tsx ErrorBoundary.tsx ExamSimulator.tsx LoginScreen.tsx OfflineIndicator.tsx PWAInstallButton.tsx QuestionFormModal.tsx StudentDashboard.tsx components/ 2>/dev/null || true && mv -f api.ts docxParser.ts firebase.ts utils/ 2>/dev/null || true && mv -f cale.ts types/ 2>/dev/null || true && mv -f usePWAInstall.ts hooks/ 2>/dev/null || true && mv -f hero_cale_road_1794980901087.jpg assets/images/ 2>/dev/null || true && cp -f _redirects apple-touch-icon.png icon.svg pwa-192x192.png pwa-512x512.png pwa-maskable-512x512.png public/ 2>/dev/null || true && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
